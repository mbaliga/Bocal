name: Android release

# Builds a signed release AAB for upload to the Play Console. A tagged/manual
# release fails closed when signing material is missing; a green run always
# produces a verifiable release artifact.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: web-source/package-lock.json

      - name: Build and test the web app
        working-directory: web-source
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build
          npm test
          npm run test:dist
          npm run preview:standalone
          npm run test:e2e
          npm run test:theme
          mkdir -p ../android/app/src/main/assets/www
          cp preview-dist/index.html ../android/app/src/main/assets/www/app.html

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK for connected smoke test
        working-directory: android
        env:
          BOCAL_SKIP_WEB_BUILD: "1"
        run: ./gradlew lintDebug assembleDebug --console=plain

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected Android smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          # avdmanager device ids are lowercase; "Pixel_2" fails AVD creation.
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: cd android && ./gradlew connectedDebugAndroidTest --console=plain

      - name: Check release secrets
        env:
          KEYSTORE_B64: ${{ secrets.BOCAL_UPLOAD_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BOCAL_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BOCAL_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BOCAL_UPLOAD_KEY_PASSWORD }}
        run: |
          missing=()
          [[ -n "$KEYSTORE_B64" ]] || missing+=(BOCAL_UPLOAD_KEYSTORE_B64)
          [[ -n "$KEYSTORE_PASSWORD" ]] || missing+=(BOCAL_UPLOAD_KEYSTORE_PASSWORD)
          [[ -n "$KEY_ALIAS" ]] || missing+=(BOCAL_UPLOAD_KEY_ALIAS)
          [[ -n "$KEY_PASSWORD" ]] || missing+=(BOCAL_UPLOAD_KEY_PASSWORD)
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing release signing secrets: ${missing[*]}"
            exit 1
          fi
          echo "All release signing secrets are present."

      - name: Build signed release AAB
        working-directory: android
        env:
          BOCAL_SKIP_WEB_BUILD: "1"
          BOCAL_UPLOAD_KEYSTORE_B64: ${{ secrets.BOCAL_UPLOAD_KEYSTORE_B64 }}
          BOCAL_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.BOCAL_UPLOAD_KEYSTORE_PASSWORD }}
          BOCAL_UPLOAD_KEY_ALIAS: ${{ secrets.BOCAL_UPLOAD_KEY_ALIAS }}
          BOCAL_UPLOAD_KEY_PASSWORD: ${{ secrets.BOCAL_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --console=plain

      - name: Verify signed release AAB
        working-directory: android
        run: ./verify-aab.sh app/build/outputs/bundle/release/app-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: bocal-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Remove decoded signing material
        if: always()
        run: rm -f android/app/build/release-upload-keystore.jks
