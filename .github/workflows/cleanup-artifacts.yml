name: Cleanup old Actions artifacts
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      keep:
        description: 'Recent ordinary artifacts to keep per name (1-10)'
        required: false
        default: '3'
permissions:
  actions: write
  contents: read
concurrency:
  group: bocal-storage-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prune old artifacts without deleting active-run handoffs
        uses: actions/github-script@v9
        env:
          KEEP_COUNT: ${{ github.event.inputs.keep }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const parsed = Number(process.env.KEEP_COUNT || 3);
            const keep = Number.isInteger(parsed) ? Math.max(1, Math.min(10, parsed)) : 3;
            const now = Date.now();
            const active = new Set();
            for (const status of ['in_progress', 'queued', 'waiting', 'pending']) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, { owner, repo, status, per_page: 100 });
              for (const run of runs) active.add(run.id);
            }
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, { owner, repo, per_page: 100 });
            const byName = new Map();
            for (const artifact of artifacts) {
              if (!byName.has(artifact.name)) byName.set(artifact.name, []);
              byName.get(artifact.name).push(artifact);
            }
            let removed = 0;
            for (const [name, list] of byName) {
              list.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
              for (const artifact of list.slice(keep)) {
                const age = now - Date.parse(artifact.created_at);
                if (!Number.isFinite(age) || age < 2 * 3600000 || active.has(artifact.workflow_run?.id)) continue;
                if (name === 'bocal-release-candidate' && age < 14 * 86400000) continue;
                await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
                removed++;
              }
            }
            console.log(`Removed ${removed} old artifacts; recent and active-run artifacts retained.`);
      - name: Prune stale caches instead of clearing every build cache
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const caches = await github.paginate(github.rest.actions.getActionsCacheList, { owner, repo, per_page: 100 });
            const now = Date.now();
            const budget = 1024 * 1024 * 1024; // Soft 1 GiB budget; recently used entries stay protected.
            let total = caches.reduce((sum, item) => sum + (item.size_in_bytes || 0), 0);
            caches.sort((a, b) => Date.parse(a.last_accessed_at) - Date.parse(b.last_accessed_at));
            for (const cache of caches) {
              const idle = now - Date.parse(cache.last_accessed_at);
              if (!Number.isFinite(idle) || idle < 86400000) continue;
              if (idle < 7 * 86400000 && total <= budget) continue;
              await github.rest.actions.deleteActionsCacheById({ owner, repo, cache_id: cache.id });
              total -= cache.size_in_bytes || 0;
            }
            console.log(`Remaining cache estimate: ${(total / 1048576).toFixed(1)} MiB; entries used in the past day retained.`);
