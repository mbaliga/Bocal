name: Hardening evidence
# Maintenance evidence only: never writes repository refs or publishes releases.
on:
  push:
    branches: [feat/production-v1-hardening]
    paths: [.github/workflows/hardening-evidence.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          mkdir -p evidence
          git archive --format=tar.gz --output=evidence/source.tar.gz HEAD
          git rev-parse HEAD > evidence/SOURCE_SHA
      - uses: actions/upload-artifact@v4
        with:
          name: bocal-source-evidence
          path: evidence/
          retention-days: 1
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-source
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare security update candidate, not a committed change
        run: |
          mkdir -p ../dependency-candidate
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const targets = { next: '16.3.5', 'eslint-config-next': '16.3.5', vite: '8.3.0', '@cloudflare/vite-plugin': '1.54.11' };
          const metadata = {};
          const manifest = JSON.parse(fs.readFileSync('package.json'));
          for (const [name, version] of Object.entries(targets)) {
            const record = JSON.parse(execFileSync('npm', ['view', `${name}@${version}`, '--json'], { encoding: 'utf8' }));
            if (record.version !== version) throw new Error(`Version not verified: ${name}`);
            metadata[name] = record;
            (manifest.dependencies[name] ? manifest.dependencies : manifest.devDependencies)[name] = version;
          }
          const reactPackages = ['react', 'react-dom', 'react-server-dom-webpack'];
          const stable = reactPackages.map(name => JSON.parse(execFileSync('npm', ['view', name, 'versions', '--json'], { encoding: 'utf8' })).filter(v => /^19\.2\.\d+$/.test(v)));
          const common = stable[0].filter(v => stable.every(list => list.includes(v))).sort((a,b) => Number(a.split('.')[2]) - Number(b.split('.')[2]));
          const reactVersion = common.at(-1);
          if (!reactVersion || Number(reactVersion.split('.')[2]) < 8) throw new Error('No verified common patched React 19.2 version; manual review required.');
          for (const name of reactPackages) {
            metadata[name] = JSON.parse(execFileSync('npm', ['view', `${name}@${reactVersion}`, '--json'], { encoding: 'utf8' }));
            (manifest.dependencies[name] ? manifest.dependencies : manifest.devDependencies)[name] = reactVersion;
          }
          const wranglerVersions = JSON.parse(execFileSync('npm', ['view', 'wrangler', 'versions', '--json'], { encoding: 'utf8' })).filter(v => /^4\.\d+\.\d+$/.test(v)).sort((a,b) => { const x=a.split('.').map(Number), y=b.split('.').map(Number); return x[1]-y[1] || x[2]-y[2]; });
          manifest.devDependencies.wrangler = wranglerVersions.at(-1);
          metadata.wrangler = JSON.parse(execFileSync('npm', ['view', `wrangler@${manifest.devDependencies.wrangler}`, '--json'], { encoding: 'utf8' }));
          fs.writeFileSync('../dependency-candidate/registry-metadata.json', JSON.stringify(metadata, null, 2));
          fs.writeFileSync('package.json', JSON.stringify(manifest, null, 2) + '\n');
          JS
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || test -f package-lock.json
      - name: Save candidate for inspection
        if: always()
        run: |
          cp package.json package-lock.json ../dependency-candidate/
          git diff -- package.json package-lock.json > ../dependency-candidate/changes.diff
          npm audit --json > ../dependency-candidate/audit.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bocal-dependency-candidate
          path: dependency-candidate/
          retention-days: 1
