name: Android debug APK
on:
  push:
    branches: [main]
    paths: ["android/**", "web-source/**", "scripts/**", ".github/workflows/**"]
  pull_request:
    paths: ["android/**", "web-source/**", "scripts/**", ".github/workflows/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    uses: ./.github/workflows/web-quality.yml
  apk:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bocal-web-app
          path: staged-web
      - name: Stage the exact tested bundle
        run: |
          mkdir -p android/app/src/main/assets/www
          cp staged-web/index.html android/app/src/main/assets/www/app.html
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug, instrumented tests, and minified release variant
        working-directory: android
        env:
          BOCAL_SKIP_WEB_BUILD: "1"
        run: ./gradlew lintDebug lintRelease testDebugUnitTest assembleDebug assembleDebugAndroidTest assembleRelease --console=plain
      - name: Verify the APK contains the tested offline application
        run: |
          python3 scripts/verify_android_artifact.py android/app/build/outputs/apk/debug/app-debug.apk --expected-html staged-web/index.html
          python3 scripts/verify_android_artifact.py android/app/build/outputs/apk/release/app-release-unsigned.apk --expected-html staged-web/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: bocal-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 3
