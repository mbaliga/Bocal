name: Android debug APK

# Builds the debug-signed APK and uploads it as a workflow artifact -- the
# repo has no release-signing keystore (a deliberate, permanent decision, not
# a missing build step), so this is the distribution path for on-device
# testing until one exists.
on:
  push:
    branches:
      - main
      - "claude/**"
      - "codex/**"
    paths:
      - "android/**"
      - "web-source/**"
      - ".github/workflows/android-debug-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          # compileSdk 37 resolves to the dotted package id below, not
          # "platforms;android-37" -- confirmed against this platform's own
          # package.xml, which is where the first run of this workflow
          # failed (sdkmanager: "Failed to find package 'platforms;android-37'").
          packages: "platforms;android-37.0 build-tools;36.0.0"

      # The APK bundles the web app verbatim (assets/www/app.html), so it has
      # to exist and be current before Gradle packages it.
      - name: Build the standalone web app
        working-directory: web-source
        run: |
          npm ci
          npm run preview:standalone
          mkdir -p ../android/app/src/main/assets/www
          cp preview-dist/index.html ../android/app/src/main/assets/www/app.html

      - name: Test and build debug APKs
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --console=plain

      - name: Stage versioned debug APKs
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' android/app/build.gradle.kts | head -n 1)"
          test -n "$version"
          short_sha="${GITHUB_SHA::7}"

          mkdir -p debug-apks
          install -m 0644 \
            android/app/build/outputs/apk/debug/app-debug.apk \
            "debug-apks/Bocal-debug-${version}-${short_sha}.apk"
          install -m 0644 \
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            "debug-apks/Bocal-debug-androidTest-${version}-${short_sha}.apk"

      # APK commits do not retrigger this workflow because debug-apks/** is
      # deliberately absent from the push path filter above.
      - name: Commit debug APKs to the source branch
        if: startsWith(github.ref, 'refs/heads/codex/')
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug-apks/
          git diff --cached --quiet && exit 0
          git commit -m "Add debug APKs for ${GITHUB_SHA::7}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: bocal-debug-apks-${{ github.sha }}
          path: debug-apks/*.apk
          if-no-files-found: error
