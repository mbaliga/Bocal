name: Scoped production dependency refresh
# One-time lockfile maintenance on the explicitly authorised hardening branch.
# No fork checkout, secrets, production deployment, forced update or main push.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ["qa/dependency-refresh.json", ".github/workflows/dependency-refresh.yml"]
permissions:
  contents: read
concurrency:
  group: dependency-refresh-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/production-v1-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check one-time request
        id: request
        run: |
          node -e 'const f=require("./qa/dependency-refresh.json"); if(f.state==="pending" && f.branch==="feat/production-v1-hardening") console.log("pending=true")' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.request.outputs.pending == 'true'
        with:
          node-version: "22.13.0"
      - name: Resolve the selected patched package versions
        if: steps.request.outputs.pending == 'true'
        working-directory: web-source
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const request=JSON.parse(fs.readFileSync('../qa/dependency-refresh.json','utf8'));
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          for (const section of ['dependencies','devDependencies']) {
            for (const [name,version] of Object.entries(request[section])) {
              const resolved=JSON.parse(execFileSync('npm',['view',`${name}@${version}`,'version','--json'],{encoding:'utf8',timeout:60000}));
              if(resolved!==version) throw new Error(`Registry did not confirm ${name}@${version}`);
              pkg[section][name]=version;
            }
          }
          const values=JSON.parse(execFileSync('npm',['view','wrangler@4','version','--json'],{encoding:'utf8',timeout:60000}));
          const versions=(Array.isArray(values)?values:[values]).filter(v=>/^4\.\d+\.\d+$/.test(v));
          versions.sort((a,b)=>{const x=a.split('.').map(Number),y=b.split('.').map(Number);return x[1]-y[1]||x[2]-y[2]});
          if(!versions.length) throw new Error('No stable Wrangler 4 release found');
          pkg.devDependencies.wrangler=versions.at(-1);
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          console.log('Selected package versions:',JSON.stringify({dependencies:pkg.dependencies,devDependencies:pkg.devDependencies}));
          JS
          npm install --package-lock-only --ignore-scripts
          # Keep all declared versions; never apply a forced/downgrade audit fix.
          set +e
          npm audit fix --package-lock-only --ignore-scripts
          audit_status=$?
          set -e
          if [ "$audit_status" -gt 1 ]; then exit "$audit_status"; fi
          node ../scripts/audit-dependencies.mjs
      - name: Commit only the manifests and consumed request
        if: steps.request.outputs.pending == 'true'
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          node -e 'const fs=require("fs"),p="qa/dependency-refresh.json",f=JSON.parse(fs.readFileSync(p));f.state="applied-awaiting-validation";f.baseSha=process.env.EXPECTED_HEAD;fs.writeFileSync(p,JSON.stringify(f,null,2)+"\n")'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web-source/package.json web-source/package-lock.json qa/dependency-refresh.json
          git commit -m 'Refresh explicitly selected vulnerable dependencies for production validation'
          # A normal fast-forward push refuses concurrent edits; never force the branch.
          git push origin HEAD:refs/heads/feat/production-v1-hardening
          echo 'The new dependency commit requires a fresh normal quality run; this job is not release acceptance.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve the dependency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bocal-dependency-refresh-report
          path: qa/reports/dependency-audit.json
          if-no-files-found: warn
          retention-days: 3
